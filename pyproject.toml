[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskgraph-financial-forecasting-lab"
version = "1.7.1"
description = "Leakage-aware temporal, graph, tail-scenario and numeric-language modelling for probabilistic financial risk forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "torch>=2.3,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "requests>=2.31,<3",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
llm = ["transformers>=4.45,<6", "accelerate>=1,<2", "sentencepiece>=0.2,<1"]
garch = ["arch>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
