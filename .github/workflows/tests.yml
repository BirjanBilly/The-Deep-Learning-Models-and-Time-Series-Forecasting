name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          python -m compileall -q src scripts tests
          python -m ruff check .
      - name: Regression tests
        run: python -m pytest tests/test_performance_v170.py -q -p no:cacheprovider
      - name: Synthetic smoke test
        run: python scripts/run_performance_v170_smoke.py --device cpu
